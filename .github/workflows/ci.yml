name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `ci` not `install`: it installs exactly what the lockfile pins and
      # fails if the two have drifted, which is the point of running in CI.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (src and tests)
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          # Placeholders only. The Supabase and Gemini clients are mocked in
          # every suite; these exist because both modules throw at import when
          # their variables are missing.
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          GEMINI_API_KEY: test-gemini-key

      - name: Build
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # `tsc -b` covers src plus the tooling configs, which are a separate
      # project — a plain `tsc` silently skips referenced projects entirely.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://test.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
          VITE_API_URL: http://localhost:5001

  migrations:
    name: Migrations
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SQL parser
        run: pip install pglast

      # Applying these by hand against a live project is the only way they run,
      # so a syntax error would otherwise surface during a deploy. Postgres
      # block comments nest, which has already broken one of these files once.
      - name: Validate migrations parse as Postgres
        run: |
          python - <<'PY'
          import glob, sys
          import pglast

          failed = False
          for path in sorted(glob.glob('supabase/migrations/*.sql')):
              try:
                  statements = pglast.parse_sql(open(path, encoding='utf-8').read())
                  print(f'ok    {path} ({len(statements)} statements)')
              except Exception as exc:
                  failed = True
                  print(f'FAIL  {path}\n      {exc}')
          sys.exit(1 if failed else 0)
          PY
